name: Apply classic editorial redesign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-classic-editorial-redesign.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply classic theme and blog enhancements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('assets/styles.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* === HCE CLASSIC EDITORIAL REDESIGN v2 === */'
          if marker in css:
              css = css.split(marker)[0].rstrip()

          override = r'''/* === HCE CLASSIC EDITORIAL REDESIGN v2 === */
          :root{
            --ink:#142336;
            --ink-2:#59616a;
            --paper:#f7f3eb;
            --card:#fffdf9;
            --line:#ddd4c6;
            --accent:#8a6738;
            --accent-2:#efe5d6;
            --warm:#bd9158;
            --danger:#9f443f;
            --shadow:0 9px 28px rgba(20,35,54,.055);
            --radius:10px;
          }
          body{background:var(--paper);line-height:1.68;color:var(--ink)}
          h1,h2,h3,h4{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.025em;line-height:1.14;font-weight:700}
          h1{font-size:clamp(2.45rem,5vw,4rem);max-width:820px}
          .hero{padding:64px 0 52px}
          .hero h1{font-size:clamp(2.7rem,5.3vw,4.15rem);margin-top:17px}
          .page-hero{padding:50px 0 30px}
          .page-hero h1{font-size:clamp(2.25rem,4.7vw,3.45rem);max-width:880px}
          .section{padding:62px 0}
          .section-head h2,.section h2{font-size:clamp(1.75rem,3vw,2.4rem)!important}
          .info-copy{max-width:820px}
          .info-copy h2{font-size:clamp(1.55rem,2.5vw,1.92rem)!important;margin:38px 0 13px}
          .info-copy h3{font-size:1.24rem;margin:27px 0 9px}
          .lead{font-size:1.08rem;line-height:1.72}
          .topbar{background:#0f1d2c;color:#f4efe7;font-size:.82rem;padding:8px 18px;letter-spacing:.01em}
          .site-header{background:rgba(247,243,235,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
          .nav{min-height:70px}
          .brand{font-family:Georgia,"Times New Roman",serif;font-size:1.12rem;letter-spacing:-.015em}
          .brandmark{width:34px;height:34px;border-radius:3px;background:#142336;font-family:Inter,ui-sans-serif,sans-serif;font-size:.72rem;letter-spacing:.04em}
          .navlinks{gap:24px;font-size:.91rem}
          .navcta,.btn{border-radius:5px;background:#142336;border-color:#142336;padding:12px 18px;font-weight:700}
          .navcta:hover,.btn:hover{filter:none;background:#20344b}
          .btn.secondary{background:transparent;color:var(--ink);border-color:#b9aa96}
          .btn.dark{background:#142336;border-color:#142336}
          .eyebrow{border-radius:3px;background:transparent;border:1px solid #c7b79f;color:var(--accent);font-size:.73rem;padding:6px 9px;letter-spacing:.09em}
          .hero-card,.calc-shell,.result-card,.card{border-radius:var(--radius);box-shadow:var(--shadow);border-color:var(--line)}
          .hero-card{padding:28px;background:#fffdf9}
          .hero-card h2{font-size:1.36rem}
          input,select,textarea{border-radius:5px;border-color:#cfc4b4;background:#fffdf9}
          input:focus,select:focus,textarea:focus{border-color:#9d7b4c;box-shadow:0 0 0 3px rgba(138,103,56,.1)}
          .section.alt{background:#f0ebe2;border-color:var(--line)}
          .card{padding:23px;background:#fffdf9}
          .card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(20,35,54,.07)}
          .card-icon{border-radius:4px;background:#eee4d5}
          .card-link{color:#76552f}
          .stats{border-radius:8px;background:var(--line)}
          .stat{background:#fffdf9}
          .tick{border-radius:3px;background:#eee4d5;color:#76552f}
          .quote-box{border-radius:9px;background:#142336;padding:34px}
          .quote-box h3{font-size:1.72rem}
          .quote-result{border-radius:6px;background:#1d3148}
          .quote-result .big{font-family:Georgia,"Times New Roman",serif;font-size:1.85rem;letter-spacing:-.025em}
          .kicker{color:#d0a46b}
          .article{border-radius:8px;background:#fffdf9;box-shadow:0 4px 16px rgba(20,35,54,.035)}
          .article-cover{height:170px;border-radius:0;background:linear-gradient(135deg,#e8dfd1,#d8d0c4)}
          .article-body{padding:21px}
          .article-body h3{font-size:1.18rem;line-height:1.28}
          .cta-band{border-radius:9px;background:#142336;padding:38px}
          .cta-band h2{font-size:clamp(1.85rem,3vw,2.55rem)!important}
          .footer{background:#0f1d2c;margin-top:52px;padding:50px 0 28px}
          .footer p,.footer a{color:#c6c0b8}
          .footer-bottom{color:#a9a197}
          .calc-shell{background:#fffdf9}
          .result-card{border-radius:9px;background:#142336}
          .result-big{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.1rem,5vw,3.55rem);letter-spacing:-.03em}
          .notice{border-radius:6px;border-color:#ddc9a8;background:#fbf2e3;color:#66533d}
          .table-wrap{border-radius:7px;background:#fffdf9}
          th{background:#eee9e1}
          .badge{border-radius:3px;background:#efe5d6;color:#76552f}
          .report-capture{border-radius:8px;background:#f9f5ef}
          .report-badge{border-radius:3px;background:#efe5d6;color:#76552f}
          .report-email-row button{border-radius:5px;background:#142336;border-color:#142336}
          .price-card{border-radius:9px;background:#fffdf9}
          .price-card.featured{background:#fffdf9;border-color:#8a6738}
          .price-tag{border-radius:3px;background:#efe5d6;color:#76552f}

          main article.info-copy{font-size:1.015rem}
          main article.info-copy>p{margin:0 0 1.15em}
          .blog-figure{margin:32px -42px 38px}
          .blog-figure img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--line);border-radius:7px;background:#f2efe9;box-shadow:0 10px 30px rgba(20,35,54,.06)}
          .blog-figure figcaption{margin-top:9px;padding:0 4px;color:#7b746b;font-size:.76rem;font-style:italic}
          .seo-link-panel{margin:36px 0 22px;padding:22px;border:1px solid #d9cebf!important;border-radius:7px!important;background:#f5efe6!important}
          .seo-link-panel>h2{font-family:Georgia,"Times New Roman",serif!important;font-size:1.42rem!important;margin:0 0 9px!important}
          .seo-link-panel>p{margin:0 0 18px!important}
          .seo-link-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
          .seo-link-panel h3{font-family:Inter,ui-sans-serif,sans-serif;font-size:.95rem!important;margin:0 0 8px!important;letter-spacing:0;text-transform:uppercase;color:#76552f}
          .seo-link-panel ul{margin:0;padding-left:20px}
          .seo-link-panel li{margin:7px 0;color:var(--ink-2)}
          .seo-link-panel a{color:#76552f;text-decoration:underline;text-underline-offset:2px;font-weight:700}
          .article-cover.hce-photo-cover{height:190px!important;background:#ded6ca!important}
          .article-cover.hce-photo-cover .blog-card-label{padding:40px 18px 14px!important;background:linear-gradient(180deg,transparent,rgba(11,24,39,.9))!important}
          @media(max-width:900px){.hero{padding-top:46px}.blog-figure{margin-left:0;margin-right:0}}
          @media(max-width:650px){.seo-link-grid{grid-template-columns:1fr}}
          @media(max-width:600px){
            h1{font-size:2.25rem}.hero h1{font-size:2.55rem}.page-hero h1{font-size:2.22rem}
            .section{padding:48px 0}.section-head h2,.section h2{font-size:1.78rem!important}
            .info-copy h2{font-size:1.5rem!important}.lead{font-size:1rem}.blog-figure{margin:26px 0 30px}
            .article-cover.hce-photo-cover{height:205px!important}
          }
          '''
          css_path.write_text(css + '\n\n' + override.strip() + '\n', encoding='utf-8')

          topics = {
            'roofing': {
              'photo':'https://cdn.pixabay.com/photo/2016/03/27/19/40/shingles-1283921_1280.jpg',
              'source':'https://pixabay.com/photos/shingles-roof-house-construction-1283921/',
              'links':[
                ('Roof Replacement Cost Calculator','/calculators/roof-replacement.html'),
                ('Roofing Square Calculator','/calculators/roofing-square.html'),
                ('Roof Pitch Calculator','/calculators/roof-pitch.html'),
                ('Roof Replacement Cost Guide','/guides/roof-replacement-cost.html')]
            },
            'concrete': {
              'photo':'https://cdn.pixabay.com/photo/2014/07/31/21/20/cement-406822_1280.jpg',
              'source':'https://pixabay.com/photos/cement-concrete-construction-worker-406822/',
              'links':[
                ('Concrete Calculator','/calculators/concrete.html'),
                ('Cubic Yard Calculator','/calculators/cubic-yard.html'),
                ('How Many Cubic Yards Do I Need?','/blog/how-many-cubic-yards-do-i-need.html')]
            },
            'hvac': {
              'photo':'https://cdn.pixabay.com/photo/2021/09/08/07/20/air-conditioner-6605973_1280.jpg',
              'source':'https://pixabay.com/photos/air-conditioner-air-conditioning-unit-6605973/',
              'links':[
                ('HVAC Replacement Cost Calculator','/calculators/hvac.html'),
                ('HVAC Repair vs Replacement','/blog/hvac-repair-vs-replacement.html'),
                ('Heat Pump vs Central Air Cost','/blog/heat-pump-vs-central-air-cost.html')]
            },
            'painting': {
              'photo':'https://cdn.pixabay.com/photo/2017/04/21/01/43/painter-2247395_1280.jpg',
              'source':'https://pixabay.com/photos/painter-paint-house-indoor-2247395/',
              'links':[
                ('Paint Calculator','/calculators/paint.html'),
                ('Interior Painting Cost Per Square Foot','/blog/interior-painting-cost-per-square-foot.html'),
                ('How Much Does It Cost to Paint a Room?','/blog/how-much-does-it-cost-to-paint-a-room.html')]
            },
            'flooring': {
              'photo':'https://cdn.pixabay.com/photo/2017/02/23/02/41/wood-2091171_1280.jpg',
              'source':'https://pixabay.com/photos/wood-floor-wood-floor-wood-flooring-2091171/',
              'links':[
                ('Flooring Cost Calculator','/calculators/flooring.html'),
                ('How Much Flooring Do I Need?','/blog/how-much-flooring-do-i-need.html'),
                ('Vinyl Plank vs Laminate Flooring Cost','/blog/vinyl-plank-vs-laminate-flooring-cost.html')]
            },
            'gravel': {
              'photo':'https://cdn.pixabay.com/photo/2020/06/10/23/27/country-side-5284614_1280.jpg',
              'source':'https://pixabay.com/photos/country-side-gravel-road-nature-5284614/',
              'links':[
                ('Gravel Calculator','/calculators/gravel.html'),
                ('Cubic Yard Calculator','/calculators/cubic-yard.html'),
                ('Gravel Driveway Cost','/blog/gravel-driveway-cost.html')]
            },
            'mulch': {
              'photo':'https://cdn.pixabay.com/photo/2021/06/02/14/47/mulch-6304664_1280.jpg',
              'source':'https://pixabay.com/photos/mulch-wood-gardening-wood-chips-6304664/',
              'links':[
                ('Mulch Calculator','/calculators/mulch.html'),
                ('Cubic Yard Calculator','/calculators/cubic-yard.html'),
                ('Mulch Cost Per Yard','/blog/mulch-cost-per-yard.html')]
            },
            'windows': {
              'photo':'https://cdn.pixabay.com/photo/2016/07/10/15/58/house-1507920_1280.jpg',
              'source':'https://pixabay.com/photos/house-window-home-house-window-1507920/',
              'links':[
                ('All Home Improvement Projects','/projects.html'),
                ('Window Replacement Cost Per Window','/blog/window-replacement-cost-per-window.html'),
                ('Double-Pane vs Triple-Pane Windows','/blog/double-pane-vs-triple-pane-windows.html')]
            },
            'plumbing': {
              'photo':'https://cdn.pixabay.com/photo/2016/11/11/12/18/boiler-1816642_1280.jpg',
              'source':'https://pixabay.com/photos/water-heater-boiler-maintenance-1816642/',
              'links':[
                ('All Home Improvement Projects','/projects.html'),
                ('Water Heater Repair vs Replacement','/blog/water-heater-repair-vs-replacement.html'),
                ('How to Detect a Hidden Water Leak','/blog/how-to-detect-hidden-water-leak.html')]
            },
            'general': {
              'photo':'https://cdn.pixabay.com/photo/2016/07/10/15/58/house-1507920_1280.jpg',
              'source':'https://pixabay.com/photos/house-window-home-house-window-1507920/',
              'links':[
                ('Square Footage Calculator','/calculators/square-footage.html'),
                ('Cubic Yard Calculator','/calculators/cubic-yard.html'),
                ('All HomeCostEngine Calculators','/calculators/')]
            }
          }

          def topic_for(slug):
              s = slug.lower()
              if re.search(r'water-heater|toilet|water-leak|plumb', s): return 'plumbing'
              if 'window' in s: return 'windows'
              if re.search(r'hvac|heat-pump|seer|air-condition|ac-repair|furnace', s): return 'hvac'
              if 'paint' in s: return 'painting'
              if re.search(r'floor|vinyl|laminate', s): return 'flooring'
              if 'gravel' in s: return 'gravel'
              if re.search(r'mulch|landscap', s): return 'mulch'
              if re.search(r'concrete|cubic-yard|slab|patio|ready-mix', s): return 'concrete'
              if re.search(r'roof|shingle|attic-ventilation', s): return 'roofing'
              return 'general'

          for path in sorted(Path('blog').glob('*.html')):
              if path.name == 'index.html':
                  continue
              html = path.read_text(encoding='utf-8')
              topic = topics[topic_for(path.stem)]
              title_match = re.search(r'<h1>(.*?)</h1>', html, re.S)
              title = re.sub('<[^>]+>', '', title_match.group(1)).strip() if title_match else path.stem.replace('-', ' ').title()

              figure = (f'<figure class="blog-figure hce-external-photo">'
                        f'<img src="{topic["photo"]}" alt="{title}" loading="eager" fetchpriority="high" referrerpolicy="no-referrer">'
                        f'<figcaption>Illustrative project photo via <a href="{topic["source"]}" target="_blank" rel="noopener noreferrer">Pixabay</a>.</figcaption>'
                        f'</figure>')

              article_match = re.search(r'(<article class="container info-copy">)(.*?)(</article>)', html, re.S)
              if article_match:
                  body = article_match.group(2)
                  existing_figure = re.search(r'<figure class="blog-figure[^>]*>.*?</figure>', body, re.S)
                  if existing_figure:
                      body = body[:existing_figure.start()] + figure + body[existing_figure.end():]
                  else:
                      first_p = re.search(r'</p>', body, re.S)
                      if first_p:
                          body = body[:first_p.end()] + '\n' + figure + body[first_p.end():]
                      else:
                          body = figure + body

                  if '<!-- hce-static-related -->' not in body:
                      current = '/' + path.as_posix()
                      links = [(label, href) for label, href in topic['links'] if href.rstrip('/') != current.rstrip('/')][:3]
                      while len(links) < 3:
                          fallback = [('All Calculators','/calculators/'),('Cost Guides','/guides/'),('Home Improvement Blog','/blog/')]
                          for item in fallback:
                              if item not in links and item[1].rstrip('/') != current.rstrip('/'):
                                  links.append(item)
                              if len(links) >= 3: break
                      link_html = ''.join(f'<li><a href="{href}">{label}</a></li>' for label, href in links[:3])
                      panel = ('\n<!-- hce-static-related -->\n'
                               '<aside class="seo-link-panel" aria-label="Related HomeCostEngine resources">'
                               '<h2>Continue planning</h2>'
                               '<p>Use these related HomeCostEngine tools and guides to check the next part of your project.</p>'
                               f'<ul>{link_html}</ul>'
                               '</aside>\n')
                      body += panel

                  html = html[:article_match.start()] + article_match.group(1) + body + article_match.group(3) + html[article_match.end():]
                  path.write_text(html, encoding='utf-8')

          # One-time workflow: remove itself after applying the changes.
          Path('.github/workflows/apply-classic-editorial-redesign.yml').unlink(missing_ok=True)
          PY

      - name: Commit redesign
        shell: bash
        run: |
          git config user.name "HomeCostEngine Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Classic editorial redesign, better blog photos and internal links"
          git push origin main
