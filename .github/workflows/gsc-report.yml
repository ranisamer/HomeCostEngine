name: U.S. Search Console report

on:
  schedule:
    - cron: '37 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gsc-report.yml'
      - 'scripts/gsc_report.py'
      - 'scripts/test_gsc_report.py'
      - 'scripts/requirements-gsc.txt'

permissions:
  contents: read

concurrency:
  group: gsc-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check program date
        id: program
        run: |
          if [ "$(date -u +%F)" \> "2026-12-29" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: steps.program.outputs.active == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        if: steps.program.outputs.active == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install reporting dependencies
        if: steps.program.outputs.active == 'true'
        run: python -m pip install -r scripts/requirements-gsc.txt
      - name: Test reporting logic
        if: steps.program.outputs.active == 'true'
        run: python -m unittest discover -s scripts -p test_gsc_report.py
      - name: Fetch read-only U.S. Web report
        if: steps.program.outputs.active == 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_DOMAIN: homecostengine.com
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY }}
        run: python scripts/gsc_report.py
      - name: Save reports
        if: steps.program.outputs.active == 'true' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gsc-us-web-report
          path: gsc-output/
          retention-days: 90
          if-no-files-found: error
