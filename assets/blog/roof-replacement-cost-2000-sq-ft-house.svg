<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">How living area differs from roof area on a 2,000 square foot home</title>
<desc id="desc">A HomeCostEngine planning diagram comparing a one-story and two-story 2,000 square foot house to show why roof surface must be measured separately from interior floor area.</desc>
<rect width="1600" height="900" fill="#f3f6f8"/>
<rect x="90" y="80" width="1420" height="740" rx="34" fill="#ffffff" stroke="#d7e0e8" stroke-width="3"/>
<text x="150" y="165" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="700" fill="#102033">2,000 sq ft home ≠ 2,000 sq ft roof</text>
<text x="150" y="220" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#526272">Roof surface depends on footprint, pitch, overhangs, garages and roof geometry.</text>

<g transform="translate(155 300)">
  <text x="245" y="0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#102033">One-story layout</text>
  <polygon points="20,185 245,55 470,185" fill="#dbe5ec" stroke="#102033" stroke-width="8"/>
  <rect x="70" y="185" width="350" height="245" rx="8" fill="#eef3f6" stroke="#102033" stroke-width="8"/>
  <rect x="215" y="300" width="75" height="130" fill="#ffffff" stroke="#102033" stroke-width="6"/>
  <line x1="45" y1="465" x2="445" y2="465" stroke="#8b9aa8" stroke-width="4"/>
  <line x1="45" y1="448" x2="45" y2="482" stroke="#8b9aa8" stroke-width="4"/>
  <line x1="445" y1="448" x2="445" y2="482" stroke="#8b9aa8" stroke-width="4"/>
  <text x="245" y="515" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#526272">larger footprint → often more roof area</text>
</g>

<g transform="translate(925 300)">
  <text x="245" y="0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#102033">Two-story layout</text>
  <polygon points="65,165 245,55 425,165" fill="#dbe5ec" stroke="#102033" stroke-width="8"/>
  <rect x="105" y="165" width="280" height="265" rx="8" fill="#eef3f6" stroke="#102033" stroke-width="8"/>
  <line x1="105" y1="300" x2="385" y2="300" stroke="#102033" stroke-width="6"/>
  <rect x="215" y="335" width="65" height="95" fill="#ffffff" stroke="#102033" stroke-width="6"/>
  <line x1="85" y1="465" x2="405" y2="465" stroke="#8b9aa8" stroke-width="4"/>
  <line x1="85" y1="448" x2="85" y2="482" stroke="#8b9aa8" stroke-width="4"/>
  <line x1="405" y1="448" x2="405" y2="482" stroke="#8b9aa8" stroke-width="4"/>
  <text x="245" y="515" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#526272">smaller footprint → potentially less roof area</text>
</g>

<rect x="270" y="755" width="1060" height="2" fill="#d7e0e8"/>
<text x="800" y="795" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#526272">Measure the roof planes first, then convert surface area to roofing squares.</text>
</svg>