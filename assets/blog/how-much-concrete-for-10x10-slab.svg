<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Concrete quantity for a 10 by 10 foot slab</title>
<desc id="desc">HomeCostEngine diagram showing a 10 foot by 10 foot slab and example concrete volumes at common thicknesses.</desc>
<rect width="1600" height="900" fill="#f3f6f8"/>
<rect x="80" y="70" width="1440" height="760" rx="34" fill="#fff" stroke="#d7e0e8" stroke-width="3"/>
<text x="150" y="155" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700" fill="#102033">10 × 10 ft slab: thickness changes the volume</text>
<text x="150" y="210" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#526272">Area = 100 sq ft. Volume = length × width × thickness.</text>
<g transform="translate(145 285)">
<polygon points="100,120 610,120 760,240 250,240" fill="#d9e1e6" stroke="#102033" stroke-width="7"/>
<polygon points="250,240 760,240 760,330 250,330" fill="#c3cdd4" stroke="#102033" stroke-width="7"/>
<polygon points="100,120 250,240 250,330 100,210" fill="#b4c0c8" stroke="#102033" stroke-width="7"/>
<line x1="100" y1="70" x2="610" y2="70" stroke="#687988" stroke-width="4"/>
<line x1="100" y1="52" x2="100" y2="88" stroke="#687988" stroke-width="4"/>
<line x1="610" y1="52" x2="610" y2="88" stroke="#687988" stroke-width="4"/>
<text x="355" y="52" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#102033">10 ft</text>
<line x1="795" y1="240" x2="930" y2="350" stroke="#687988" stroke-width="4"/>
<text x="905" y="395" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#102033">10 ft</text>
<line x1="800" y1="245" x2="800" y2="330" stroke="#687988" stroke-width="4"/>
<text x="835" y="296" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#102033">thickness</text>
</g>
<g transform="translate(1030 300)" font-family="Arial,Helvetica,sans-serif">
<text x="0" y="0" font-size="30" font-weight="700" fill="#102033">Theoretical volume</text>
<text x="0" y="65" font-size="27" fill="#526272">3 in  →  0.93 yd³</text>
<text x="0" y="120" font-size="27" fill="#526272">4 in  →  1.23 yd³</text>
<text x="0" y="175" font-size="27" fill="#526272">5 in  →  1.54 yd³</text>
<text x="0" y="230" font-size="27" fill="#526272">6 in  →  1.85 yd³</text>
<text x="0" y="315" font-size="23" fill="#526272">Confirm forms, base and order increment</text>
<text x="0" y="350" font-size="23" fill="#526272">with your supplier or contractor.</text>
</g>
<text x="800" y="785" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#526272">Planning quantities only — actual order size depends on field conditions and supplier increments.</text>
</svg>